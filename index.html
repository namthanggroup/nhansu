<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHÂN SỰ TẬP ĐOÀN</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000; /* optional: tránh nháy trắng khi load */
    }

    /* Khung bao toàn màn hình */
    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100vh; /* full viewport height */
      overflow: hidden;
    }

    /* AppSheet chiếm toàn bộ màn hình */
    .appsheet-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* YouTube ẩn */
    .bg-audio-frame {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -9999px;   /* đẩy ra ngoài khung nhìn */
      top: -9999px;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Iframe YouTube chạy nền, tắt tiếng, auto-play -->
   <iframe
  id="ytPlayer"
  src="https://www.youtube.com/embed/rRH_MMpZRs4?enablejsapi=1&autoplay=1&mute=0"
  style="width:1px;height:1px;position:absolute;left:-9999px;"
  allow="autoplay"
></iframe>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  let player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('ytPlayer', {
      events: {
        'onReady': (event) => console.log('✅ Player ready'),
        'onStateChange': (event) => {
          if (event.data === YT.PlayerState.PLAYING) {
            console.log('🎵 YouTube đang phát ngầm');
          } else if (event.data === YT.PlayerState.PAUSED) {
            console.log('⏸ Video tạm dừng');
          } else if (event.data === YT.PlayerState.ENDED) {
            console.log('🔁 Video kết thúc');
          }
        }
      }
    });
  }
</script>


    <!-- Iframe AppSheet chính -->
    <iframe
      class="appsheet-frame"
      src="https://www.appsheet.com/start/a99d9f48-bfe6-42f6-a438-815352f95bb2"
      allowfullscreen
    ></iframe>
  </div>

</body>
</html>
